name: Continuous Integration Github Actions

on:
  push:
    branches:
      - feature
      - 'feature/**'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Build Application JAR and Test
        env:
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
        run: mvn clean package

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gymstock:latest .

      - name: Push to Docker Hub Container Registry
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/gymstock:latest ${{ secrets.DOCKER_USERNAME }}/gymstock:${{ github.run_id }}
          
          docker push ${{ secrets.DOCKER_USERNAME }}/gymstock:${{ github.run_id }}
        #  docker push ${{ secrets.DOCKER_USERNAME }}/gymstock:latest -  I commented so that my feature branches wouldn't overwrite my images with the "latest" tag.
